<style>
:root{
  --deep:#CDEBF2;
  --deep2:#F1FAFB;
  --deep3:#A9DCE7;
  --blue-ink:#1E4E5A;
  --cream:#F7F2E6;
  --cream2:#FBF8F1;
  --sand:#DFCBA0;
  --sand-deep:#C9AE79;
  --sage:#8EA28F;
  --sage-deep:#71876F;
  --dusty:#4E828C;
  --ink:#372F26;
  --ink-soft:#5B5346;
  --line:rgba(55,47,38,0.12);
  --line-dark:rgba(30,78,90,0.14);
  --danger:#A9634F;
  --shadow: 0 18px 40px -20px rgba(10,28,30,0.35);
  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:'Manrope', -apple-system, sans-serif;
  color:var(--ink);
  background:var(--cream);
  overscroll-behavior-y: none;
}
h1,h2,h3,.serif{
  font-family:'Fraunces', Georgia, serif;
  font-weight:480;
  letter-spacing:-0.01em;
}
em.soft{
  font-style:italic;
  font-weight:420;
  font-family:'Fraunces', Georgia, serif;
}
button{font-family:inherit; -webkit-appearance:none; appearance:none; border:none; background:none; cursor:pointer; color:inherit;}
textarea, input{font-family:inherit; border:none; outline:none; background:none; color:inherit;}
::selection{background:var(--sand); color:var(--ink);}

#root{
  max-width:460px;
  min-height:100vh;
  min-height:100dvh;
  margin:0 auto;
  position:relative;
  background:var(--cream);
  display:flex;
  flex-direction:column;
}

/* ---------- shared layout ---------- */
.screen{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  min-height:100dvh;
  animation: fadein 340ms ease;
}
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
.pad{ padding: 0 22px; }
.scroll-area{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom: 24px;}

/* dark hero surfaces */
.surface-deep{
  background: radial-gradient(120% 90% at 20% 0%, var(--deep3) 0%, var(--deep) 46%, var(--deep2) 100%);
  color: var(--blue-ink);
  position:relative;
  overflow:hidden;
}
.surface-deep::before{
  content:"";
  position:absolute; inset:0;
  background:
    radial-gradient(60% 40% at 85% 8%, rgba(255,255,255,0.4), transparent 60%),
    radial-gradient(50% 30% at 10% 85%, rgba(223,203,160,0.14), transparent 60%);
  pointer-events:none;
}
.wave{
  position:absolute; left:-10%; right:-10%; height:220px;
  opacity:0.5; pointer-events:none;
}

/* bottom nav */
.tabbar{
  display:flex;
  border-top:1px solid var(--line);
  background:var(--cream2);
  padding: 10px 10px calc(10px + var(--safe-bottom));
  position:sticky; bottom:0; z-index:20;
}
.tabbar.on-deep{ background: rgba(255,255,255,0.55); backdrop-filter: blur(14px); border-top:1px solid var(--line-dark); }
.tab{
  flex:1;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  padding:8px 4px 4px;
  font-size:12.5px;
  font-weight:600;
  color: var(--ink-soft);
  border-radius:14px;
  transition: color .2s ease;
}
.on-deep .tab{ color: rgba(30,78,90,0.5); }
.tab.active{ color: var(--ink); }
.on-deep .tab.active{ color: var(--blue-ink); }
.tab .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0; transition:opacity .2s ease; }
.tab.active .dot{ opacity:1; }
.tab svg{ width:22px; height:22px; }

/* buttons */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%;
  padding:17px 20px;
  border-radius:100px;
  font-size:16px;
  font-weight:700;
  letter-spacing:0.005em;
  transition: transform .15s ease, opacity .15s ease;
}
.btn:active{ transform:scale(0.975); }
.btn-primary{ background:var(--ink); color:var(--cream2); }
.btn-cream{ background:var(--cream2); color:var(--blue-ink); }
.btn-sand{ background:var(--sand); color:var(--ink); }
.btn-ghost{ background:transparent; color:var(--ink-soft); font-weight:600; }
.btn-ghost.on-deep{ color:rgba(30,78,90,0.75); }
.btn[disabled]{ opacity:0.38; pointer-events:none; }
.btn-outline{
  background:transparent; border:1.5px solid var(--line); color:var(--ink);
}

/* top bar for step / sub screens */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding: calc(16px + var(--safe-top)) 18px 8px;
}
.iconbtn{
  width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background: rgba(55,47,38,0.06);
}
.on-deep .iconbtn{ background: rgba(30,78,90,0.08); }
.iconbtn svg{ width:19px; height:19px; }

.progress-wrap{ padding: 4px 22px 18px; }
.progress-label{ font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:8px; letter-spacing:0.01em;}
.progress-track{ height:3px; background:var(--line); border-radius:3px; overflow:hidden;}
.progress-fill{ height:100%; background:var(--sage-deep); border-radius:3px; transition: width .4s ease;}

/* cards */
.card{
  background:var(--cream2);
  border-radius:var(--radius-md);
  border:1px solid var(--line);
  padding:18px;
}
.card-deep{
  background: rgba(255,255,255,0.55);
  border:1px solid var(--line-dark);
  border-radius:var(--radius-md);
  backdrop-filter: blur(10px);
}

/* chips / choice pills */
.chip-grid{ display:flex; flex-wrap:wrap; gap:10px; }
.chip{
  padding:12px 18px;
  border-radius:100px;
  border:1.5px solid var(--line);
  font-size:15px; font-weight:600;
  color: var(--ink-soft);
  background: var(--cream2);
  transition: all .18s ease;
}
.chip.selected{
  background: var(--ink);
  border-color: var(--ink);
  color: var(--cream2);
}
.chip[disabled]{ opacity:0.35; pointer-events:none; }
.chip.emotion-base{
  padding:14px 20px;
  font-size:16px;
}

.field{
  width:100%;
  background:var(--cream2);
  border:1.5px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px 18px;
  font-size:16.5px;
  line-height:1.5;
  color:var(--ink);
}
textarea.field{ min-height:150px; resize:none; }
.field::placeholder{ color: rgba(55,47,38,0.38); }
.field:focus{ border-color: var(--sage-deep); }

.hint-box{
  margin-top:14px;
  padding:14px 16px;
  border-radius:var(--radius-sm);
  background: rgba(142,162,143,0.14);
  border:1px solid rgba(142,162,143,0.3);
  font-size:14.5px;
  line-height:1.5;
  color: var(--ink-soft);
}

.small-link{ font-size:14px; font-weight:600; color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px; }

/* silhouette */
.silhouette-wrap{ display:flex; justify-content:center; padding: 6px 0 4px; }
.body-point{ cursor:pointer; }
.body-point circle, .body-point rect, .body-point line{ transition: all .2s ease; }

/* footer action bar (sticky bottom, above tabbar-less screens) */
.footer-actions{
  padding: 14px 22px calc(18px + var(--safe-bottom));
  border-top:1px solid var(--line);
  background:var(--cream2);
}
.footer-actions.on-deep{ background:transparent; border-top:1px solid var(--line-dark); }

/* diary list */
.entry-row{
  display:flex; flex-direction:column; gap:6px;
  padding:16px 4px;
  border-bottom:1px solid var(--line);
}
.entry-date{ font-size:12.5px; font-weight:700; color:var(--sage-deep); text-transform:none; }
.entry-summary{ font-size:15.5px; color:var(--ink-soft); line-height:1.4; }
.entry-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;}
.tag{ font-size:12px; font-weight:700; padding:4px 10px; border-radius:100px; background:rgba(223,203,160,0.4); color:var(--ink);}

.empty-state{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  gap:16px; padding: 60px 26px 20px;
}
.empty-state svg{ width:64px; height:64px; opacity:0.55;}
.empty-state p{ font-size:15.5px; color:var(--ink-soft); line-height:1.55; max-width:280px; }

/* result chain */
.chain-item{ display:flex; gap:14px; padding:16px 0; }
.chain-item + .chain-item{ border-top:1px solid var(--line-dark); }
.chain-marker{ width:8px; display:flex; justify-content:center; padding-top:6px; flex-shrink:0;}
.chain-marker .d{ width:8px; height:8px; border-radius:50%; background:var(--sand); }
.chain-label{ font-size:12px; font-weight:700; letter-spacing:0.03em; color: var(--dusty); margin-bottom:4px;}
.chain-value{ font-size:16px; line-height:1.45; color:var(--ink); }

/* stat bars */
.stat-row{ margin-bottom:14px; }
.stat-top{ display:flex; justify-content:space-between; font-size:14.5px; font-weight:700; margin-bottom:6px; }
.stat-track{ height:9px; border-radius:6px; background:var(--line); overflow:hidden;}
.stat-fill{ height:100%; border-radius:6px; background: var(--sage-deep); }

.section-title{ font-size:13px; font-weight:700; color:var(--sage-deep); letter-spacing:0.02em; margin: 26px 0 10px;}

a, .fake-link{ color:inherit; }

/* toast for delete confirm */
.overlay{
  position:fixed; inset:0; background:rgba(10,28,30,0.45);
  display:flex; align-items:flex-end; justify-content:center; z-index:60;
  animation: fadein 200ms ease;
}
.sheet{
  width:100%; max-width:460px;
  background:var(--cream2);
  border-radius:24px 24px 0 0;
  padding: 22px 22px calc(22px + var(--safe-bottom));
}
</style>
</head>

/* ============ HELPERS ============ */
function fmtDate(ts){
  const d = new Date(ts);
  const months = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
  return `${d.getDate()} ${months[d.getMonth()]}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtDayGroup(ts){
  const d = new Date(ts);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate()-1);
  const sameDay = (a,b)=> a.getDate()===b.getDate() && a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear();
  if(sameDay(d, today)) return "Сегодня";
  if(sameDay(d, yest)) return "Вчера";
  const months = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  return `${d.getDate()} ${months[d.getMonth()]}`;
}
function esc(s){
  return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function allEmotionLabels(entry){
  return entry.emotions.map(e => e.sub || e.base);
}
function bodyDisplayString(entry){
  const parts = Object.entries(entry.bodyAreas||{}).map(([area,d])=> d.sensations.length ? `${d.sensations.join(", ")} (${area})` : area);
  if(entry.bodyFreeText) parts.push(entry.bodyFreeText);
  return parts.join("; ") || "—";
}
function actionDisplayString(entry){
  const parts = [];
  if(entry.actions && entry.actions.length) parts.push(entry.actions.join(" • "));
  else if(entry.action) parts.push(entry.action);
  if(entry.actionCustom) parts.push(entry.actionCustom);
  return parts.join(" — ") || "—";
}
function loadDraftFromEntry(entry){
  const bodyAreas = {};
  Object.entries(entry.bodyAreas||{}).forEach(([area,d])=>{
    bodyAreas[area] = { sensations: (d.sensations||[]).slice(), custom: d.custom||"" };
  });
  return {
    situation: entry.situation || "",
    thought: entry.thought || "",
    emotions: (entry.emotions||[]).map(e=>({base:e.base, sub:e.sub})),
    bodyAreas: bodyAreas,
    bodyFreeText: entry.bodyFreeText || "",
    needs: (entry.needs||[]).slice(),
    actions: entry.actions ? entry.actions.slice() : (entry.action ? [entry.action] : []),
    actionCustom: entry.actionCustom || "",
    step: 1,
  };
}

/* ============ RENDER ROOT ============ */
function render(){
  const root = document.getElementById("root");
  let html = "";
  switch(state.screen){
    case "home": html = renderHome(); break;

/* ============ WIZARD ============ */
const STEP_TITLES = {
  1: {title:"Что произошло?", sub:"Опиши ситуацию коротко. Только факты, без анализа."},
  2: {title:"Что ты подумала?", sub:"Какая мысль появилась в голове в этот момент?"},
  3: {title:"Что ты почувствовала?", sub:"Выбери одну или несколько эмоций."},
  4: {title:"Как тело реагирует?", sub:"Обрати внимание, что происходит в теле прямо сейчас — это может быть что угодно."},
  5: {title:"О чём говорит эта эмоция?", sub:"Попробуй понять, что тебе сейчас действительно нужно."},
  6: {title:"Что тебе хочется сделать сейчас?", sub:"Это может быть шаг вперёд, а может — просто желание остаться в этом моменте."},
};

function renderWizard(){
  const step = state.step;
  const meta = STEP_TITLES[step];
  const pct = Math.round((step/6)*100);
  let body = "";
  if(step===1) body = stepSituation();
  else if(step===2) body = stepThought();
  else if(step===3) body = stepEmotion();
  else if(step===4) body = stepBody();
  else if(step===5) body = stepNeeds();
  else if(step===6) body = stepAction();

  return `
  <div class="screen">
    <div class="topbar">
      <button class="iconbtn" data-back="1">${svgIcon("back")}</button>
      <button class="iconbtn" data-nav="home">${svgIcon("close")}</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">Шаг ${step} из 6</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    </div>
    <div class="scroll-area pad">
      <h2 class="serif" style="font-size:25px; line-height:1.28; margin:6px 0 8px; font-weight:480;">${meta.title}</h2>
      <p style="font-size:15px; color:var(--ink-soft); line-height:1.5; margin:0 0 22px;">${meta.sub}</p>
      ${body}
    </div>
    <div class="footer-actions">
      <button class="btn btn-primary" id="wizard-continue" ${wizardCanContinue()?"":"disabled"}>${step===6?"Сохранить запись":"Продолжить"}</button>
    </div>
  </div>`;
}

function wizardCanContinue(){
  const d = state.draft;
  switch(state.step){
    case 1: return d.situation.trim().length>0;
    case 2: return d.thought.trim().length>0;
    case 3: return d.emotions.length>0;
    case 4: return Object.keys(d.bodyAreas).length>0 || d.bodyFreeText.trim().length>0;
    case 5: return d.needs.length>0;
    case 6: return d.actions.length>0 || d.actionCustom.trim().length>0;
    default: return true;
  }
}

function stepSituation(){
  return `<textarea class="field" id="situation-input" placeholder="Например: муж снова пришёл домой позже, чем обещал.">${esc(state.draft.situation)}</textarea>`;
}
function stepThought(){
  return `
  <textarea class="field" id="thought-input" placeholder="Например: «Ему всё равно на меня».">${esc(state.draft.thought)}</textarea>

}

  html += `<div class="chip-grid">`;
  allBases.forEach(base=>{
    const isSel = selectedBases.has(base);
    html += `<button class="chip emotion-base ${isSel?'selected':''}" data-emotion-base="${esc(base)}">${esc(base)}</button>`;
  });
  html += `<button class="chip" id="add-custom-emotion-btn" style="border-style:dashed;">+ Добавить свой вариант</button>`;
  html += `</div>`;

    html += `

      <input id="custom-emotion-text" type="text" maxlength="40" placeholder="Например: облегчение"

  selectedBases.forEach(base=>{

      </div>
    </div>`;
  });
  return html;
}
/* pin layout: [area, pinX, pinY, side ('l'|'r'), labelY] — side decides which column the label sits in */
const BODY_PINS = [
  ["голова", 160, 50, "r", 44],
  ["шея",    174, 72, "r", 74],
  ["горло",  160, 80, "l", 80],
  ["плечи",  122, 96, "l", 112],
  ["плечи",  198, 96, "r", 104],
  ["спина",  140, 140, "l", 140],
  ["грудь",  160, 128, "r", 140],
  ["руки",   100, 155, "l", 176],
  ["руки",   220, 155, "r", 176],
  ["живот",  160, 178, "l", 220],
  ["ноги",   142, 300, "l", 300],
  ["ноги",   178, 300, "r", 300],
];
const PIN_COL_L = 8, PIN_COL_R = 248, PIN_PILL_W = 64, PIN_PILL_H = 24;

function stepBody(){
  const selected = state.draft.bodyAreas;

  const figure = `
    <g fill="var(--dusty)" fill-opacity="0.16" stroke="var(--dusty)" stroke-width="1.6" stroke-linejoin="round">

      <rect x="96" y="90" width="20" height="106" rx="10"/>
      <rect x="204" y="90" width="20" height="106" rx="10"/>
      <path d="M129,190 L120,196 Q117,250 132,358 L154,358 Q146,270 148,192 Z"/>
      <path d="M191,190 L200,196 Q203,250 188,358 L166,358 Q174,270 172,192 Z"/>
    </g>
  `;

  const pins = BODY_PINS.map(([area, px, py, side, labelY])=>{
    const isSel = !!selected[area];
    const pillX = side==="l" ? PIN_COL_L : PIN_COL_R;
    const pillCenterX = pillX + PIN_PILL_W/2;
    const anchorX = side==="l" ? pillX + PIN_PILL_W : pillX;
    const pinFill = isSel ? "var(--sage-deep)" : "var(--cream2)";
    const pillFill = isSel ? "var(--sage-deep)" : "var(--cream2)";
    const textFill = isSel ? "var(--cream2)" : "var(--ink-soft)";
    return `
    <g class="body-point ${isSel?'selected':''}" data-body-area="${esc(area)}">
      <line x1="${px}" y1="${py}" x2="${anchorX}" y2="${labelY}" stroke="${isSel?'var(--sage-deep)':'var(--line)'}" stroke-width="1.4"/>
      <rect x="${pillX}" y="${labelY-PIN_PILL_H/2}" width="${PIN_PILL_W}" height="${PIN_PILL_H}" rx="12" fill="${pillFill}" stroke="var(--line)" stroke-width="1.3"/>
      <text x="${pillCenterX}" y="${labelY+4}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${textFill}" font-family="Manrope, sans-serif">${esc(area)}</text>
      <circle cx="${px}" cy="${py}" r="6.5" fill="${pinFill}" stroke="var(--line)" stroke-width="1.4"/>
    </g>`;
  }).join("");

  let html = `
  <div class="silhouette-wrap">
    <svg width="100%" height="380" viewBox="0 0 320 388" style="max-width:340px;">
      ${figure}
      ${pins}
    </svg>
  </div>
  <p style="text-align:center; font-size:13px; color:var(--ink-soft); margin: 2px 0 20px;">Нажми на область тела, чтобы выбрать</p>`;

  Object.entries(selected).forEach(([area, data])=>{
    const cfg = BODY_AREAS[area];
    html += `<div style="margin-top:10px;">
      <div class="section-title" style="margin-top:0;">${esc(area)}</div>
      <div class="chip-grid">
        ${cfg.sensations.map(s=>`<button class="chip ${data.sensations.includes(s)?'selected':''}" data-body-sensation="${esc(area)}|${esc(s)}">${esc(s)}</button>`).join("")}
      </div>
    </div>`;
  });

  html += `<div style="margin-top:22px;">`;
  if(state.showBodyFreeText || state.draft.bodyFreeText){
    html += `
      <div class="section-title" style="margin-top:0;">Своими словами</div>
      <textarea class="field" id="body-freetext-input" style="min-height:90px;" placeholder="Например: не ощущаю это в теле, но улыбаюсь. Или: чувствую напряжение в шее.">${esc(state.draft.bodyFreeText)}</textarea>`;
  } else {
    html += `<button class="chip" id="toggle-body-freetext-btn" style="border-style:dashed;">+ Описать своими словами</button>`;
  }
  html += `</div>`;
  return html;
}
function stepNeeds(){
  const selected = new Set(state.draft.needs);
  const allNeeds = NEEDS.concat(state.customNeeds);
  let html = `<div class="chip-grid">
    ${allNeeds.map(n=>`<button class="chip ${selected.has(n)?'selected':''}" data-need="${esc(n)}">${esc(n)}</button>`).join("")}
    <button class="chip" id="add-custom-need-btn" style="border-style:dashed;">+ Добавить свой вариант</button>
  </div>`;

  if(state.showCustomNeedInput){
    html += `
    <div class="card" style="margin-top:14px; padding:14px;">
      <input id="custom-need-text" type="text" maxlength="40" placeholder="Например: Ясность"
        style="width:100%; font-size:16px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:var(--cream2); color:var(--ink); margin-bottom:10px;">
      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary" id="save-custom-need-btn" style="padding:12px;">Сохранить</button>
        <button class="btn btn-outline" id="cancel-custom-need-btn" style="padding:12px;">Отмена</button>
      </div>
    </div>`;
  }

  if(state.draft.needs.length>0){
    const last = state.draft.needs[state.draft.needs.length-1];
    const hint = NEED_HINTS[last] || "Обрати внимание, что ты выбрала именно это — возможно, это и есть то, что тебе сейчас важно.";
    html += `<div class="hint-box">${esc(hint)}</div>`;
  }
  return html;
}
function stepAction(){
  const sel = state.draft.actions;
  const atMax = sel.length >= 4;
  let html = `<div class="chip-grid">
    ${ACTIONS.map(a=>{
      const isSel = sel.includes(a);
      const disabled = (!isSel && atMax);
      return `<button class="chip ${isSel?'selected':''}" ${disabled?'disabled':''} data-action="${esc(a)}">${esc(a)}</button>`;
    }).join("")}
  </div>`;
  html += `<p style="font-size:13px; color:var(--ink-soft); margin:12px 2px 0;">Можно выбрать до 4 вариантов · выбрано ${sel.length}/4</p>`;
  html += `<div style="margin-top:18px;">
    <div class="section-title" style="margin-top:0;">Мой маленький шаг</div>
    <textarea class="field" id="action-custom-input" style="min-height:110px;" placeholder="Например: сегодня я отменю одно необязательное дело и вечером просто отдохну.">${esc(state.draft.actionCustom)}</textarea>

  return html;
}

/* ============ RESULT ============ */

/* ============ DIARY ============ */
function renderDiary(){
  const entries = state.entries;
  let content;
  if(entries.length===0){
    content = `
    <div class="empty-state">
      ${svgIcon("diary")}
      <p>Здесь пока тихо.<br>Попробуй записать, что происходит с тобой сегодня.</p>

      groups[g].push(e);
    });
    content = Object.entries(groups).map(([g, list])=>`
      <div class="section-title">${g}</div>
      ${list.map(e=>`
        <button class="entry-row" style="width:100%; text-align:left;" data-open-entry="${e.id}">
          <div class="entry-date">${fmtDate(e.createdAt)}</div>
          <div class="entry-summary">${esc(truncate(e.situation, 100))}</div>
          <div class="entry-tags">${allEmotionLabels(e).slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
        </button>
      `).join("")}
    `).join("");
  }
  return `
  <div class="screen">
    <div class="topbar" style="justify-content:flex-start;"><div style="width:40px;"></div></div>
    <div class="scroll-area pad">
      <h1 class="serif" style="font-size:28px; margin:4px 0 20px;">Дневник</h1>
      ${content}
    </div>
    ${tabbar("diary", false)}
  </div>`;
}

/* ============ ENTRY DETAIL ============ */
function renderEntryDetail(){
  const e = state.entries.find(x=>x.id===state.currentEntryId);
  if(!e) return renderDiary();
  const emotions = allEmotionLabels(e).join(" • ");
  const bodyStr = bodyDisplayString(e);
  const needsStr = e.needs.join(" • ");
  const actionStr = actionDisplayString(e);
  const chain = [
    {label:"СИТУАЦИЯ", value:e.situation},
    {label:"МЫСЛЬ", value:`«${e.thought}»`},
    {label:"ЭМОЦИЯ", value:emotions},
    {label:"ТЕЛО", value:bodyStr},
    {label:"ПОТРЕБНОСТЬ", value:needsStr},
    {label:"МОЙ ШАГ", value:actionStr},
  ];
  return `
  <div class="screen">
    <div class="topbar">
      <button class="iconbtn" data-nav="diary">${svgIcon("back")}</button>
      <div style="display:flex; gap:8px;">
        <button class="iconbtn" data-edit-entry="${e.id}">${svgIcon("edit")}</button>
        <button class="iconbtn" data-delete-entry="${e.id}">${svgIcon("trash")}</button>
      </div>
    </div>
    <div class="scroll-area pad">
      <div class="section-title" style="margin-top:0;">${fmtDayGroup(e.createdAt)} · ${fmtDate(e.createdAt)}</div>
      <div class="card" style="margin-top:8px; padding:6px 16px;">
        ${chain.map(c=>`
          <div class="chain-item" style="border-color:var(--line) !important;">
            <div class="chain-marker"><div class="d" style="background:var(--sage-deep);"></div></div>
            <div>
              <div class="chain-label" style="color:var(--sage-deep);">${c.label}</div>
              <div class="chain-value" style="color:var(--ink);">${esc(c.value)}</div>
            </div>
          </div>
        `).join("")}
      </div>
      <div style="height:16px;"></div>
      <button class="btn btn-outline" data-edit-entry="${e.id}">✎ Редактировать</button>
      <div style="height:20px;"></div>
    </div>
  </div>`;
}

/* ============ INSIGHTS ============ */
function renderInsights(){
  const entries = state.entries;
  if(entries.length < 3){
    return `
    <div class="screen">
      <div class="topbar" style="justify-content:flex-start;"><div style="width:40px;"></div></div>
      <div class="scroll-area pad">
        <h1 class="serif" style="font-size:28px; margin:4px 0 4px;">Наблюдения</h1>
        <p style="font-size:15px; color:var(--ink-soft); margin:0 0 10px;">Что происходит со мной?</p>
        <div class="empty-state" style="padding-top:40px;">
          ${svgIcon("insights")}
          <p>Пока недостаточно записей для наблюдений.<br>Продолжай замечать себя — со временем здесь появятся твои закономерности.</p>
        </div>
      </div>
      ${tabbar("insights", false)}
    </div>`;
  }

  // stats: emotion frequency (last up to 30 entries, framed as "за последнее время")
  const emoCounts = {};
  entries.forEach(e => allEmotionLabels(e).forEach(l => { emoCounts[l] = (emoCounts[l]||0)+1; }));
  const totalEmoMentions = Object.values(emoCounts).reduce((a,b)=>a+b,0) || 1;
  const topEmotions = Object.entries(emoCounts).sort((a,b)=>b[1]-a[1]).slice(0,4);

  const needCounts = {};
  entries.forEach(e => e.needs.forEach(n => { needCounts[n] = (needCounts[n]||0)+1; }));
  const topNeed = Object.entries(needCounts).sort((a,b)=>b[1]-a[1])[0];

  const bodyCounts = {};
  entries.forEach(e => Object.entries(e.bodyAreas).forEach(([area,d])=>{
    const key = d.sensations.length ? `${d.sensations[0]} в области «${area}»` : area;
    bodyCounts[key] = (bodyCounts[key]||0)+1;
  }));
  const topBody = Object.entries(bodyCounts).sort((a,b)=>b[1]-a[1])[0];

  let relCount = 0;
  entries.forEach(e=>{
    const text = (e.situation||"").toLowerCase();
    if(RELATION_WORDS.some(w=>text.includes(w))) relCount++;
  });
  const relDominant = relCount >= Math.ceil(entries.length/2);

  // smart observation: most common (need + emotion) co-occurrence
  const pairCounts = {};
  entries.forEach(e=>{
    e.needs.forEach(n=>{
      allEmotionLabels(e).forEach(em=>{
        const k = em+"||"+n;
        pairCounts[k] = (pairCounts[k]||0)+1;
      });
    });
  });
  const topPair = Object.entries(pairCounts).sort((a,b)=>b[1]-a[1])[0];
  let smartBlock = "";
  if(topPair && topPair[1] >= 2){
    const [em, need] = topPair[0].split("||");
    smartBlock = `
    <div class="section-title">Что я замечаю?</div>
    <div class="card" style="margin-bottom:14px;">
      <p style="font-size:15px; line-height:1.55; margin:0 0 10px;">Похоже, ты несколько раз отмечала «${esc(em)}» в схожих ситуациях.</p>
      <p style="font-size:15px; line-height:1.55; margin:0;">Ты можешь обратить внимание: в такие моменты тебе часто была нужна ${esc(need.toLowerCase())}.</p>
    </div>`;
  }

  return `
  <div class="screen">
    <div class="topbar" style="justify-content:flex-start;"><div style="width:40px;"></div></div>
    <div class="scroll-area pad">
      <h1 class="serif" style="font-size:28px; margin:4px 0 4px;">Наблюдения</h1>
      <p style="font-size:15px; color:var(--ink-soft); margin:0 0 20px;">Что происходит со мной?</p>

      <div class="section-title" style="margin-top:0;">Мои эмоции</div>
      <div class="card" style="margin-bottom:6px;">
        ${topEmotions.map(([label,count])=>{
          const pct = Math.round((count/totalEmoMentions)*100);
          return `<div class="stat-row">
            <div class="stat-top"><span>${esc(label)}</span><span style="color:var(--ink-soft); font-weight:600;">${pct}%</span></div>
            <div class="stat-track"><div class="stat-fill" style="width:${pct}%;"></div></div>
          </div>`;
        }).join("")}
      </div>

      <div class="section-title">Чаще всего тебе было нужно</div>
      <div class="card" style="margin-bottom:6px;"><p style="margin:0; font-size:16px; font-weight:600;">${topNeed ? esc(topNeed[0]) : "—"}</p></div>

      <div class="section-title">Чаще всего тело реагировало</div>
      <div class="card" style="margin-bottom:6px;"><p style="margin:0; font-size:16px; font-weight:600;">${topBody ? esc(topBody[0].charAt(0).toUpperCase()+topBody[0].slice(1)) : "—"}</p></div>

      <div class="section-title">Больше всего эмоций возникало</div>
      <div class="card" style="margin-bottom:6px;"><p style="margin:0; font-size:16px; font-weight:600;">${relDominant ? "В ситуациях, связанных с отношениями" : "В самых разных ситуациях"}</p></div>

      ${smartBlock}

      <div class="hint-box" style="margin-top:22px;">Это не диагноз и не оценка. Это способ заметить свои повторяющиеся состояния.</div>
      <div style="height:16px;"></div>
    </div>
    ${tabbar("insights", false)}
  </div>`;
}

/* ============ CONFIRM DELETE SHEET ============ */
function renderConfirmSheet(){
  return `
  <div class="overlay" id="confirm-overlay">
    <div class="sheet">
      <h3 class="serif" style="font-size:20px; margin:4px 0 8px;">Удалить запись?</h3>
      <p style="font-size:14.5px; color:var(--ink-soft); margin:0 0 22px; line-height:1.5;">Это действие нельзя отменить.</p>
      <button class="btn" style="background:var(--danger); color:var(--cream2); margin-bottom:10px;" id="confirm-delete-yes">Удалить</button>
      <button class="btn btn-outline" id="confirm-delete-no">Отмена</button>
    </div>
  </div>`;
}

function renderEmotionGuideSheet(){
  return `
  <div class="overlay" id="emotion-guide-overlay">
    <div class="sheet" style="max-height:82vh; display:flex; flex-direction:column;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
        <h3 class="serif" style="font-size:20px; margin:4px 0;">Подсказка: слова для эмоций</h3>
        <button class="iconbtn" id="close-emotion-guide-btn">${svgIcon("close")}</button>
      </div>
      <p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 16px; line-height:1.5;">Это не тест. Просто список слов, который может помочь точнее назвать своё состояние.</p>
      <div style="overflow-y:auto; padding-right:2px;">
        ${Object.entries(EMOTION_GUIDE).map(([cat, words])=>`
          <div style="margin-bottom:18px;">
            <div class="section-title" style="margin:0 0 8px;">${esc(cat)}</div>
            <div class="chip-grid">
              ${words.map(w=>`<span class="chip" style="cursor:default;">${esc(w)}</span>`).join("")}
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  </div>`;
}

/* ============ EVENT HANDLING ============ */
function attachHandlers(){
  const root = document.getElementById("root");

  root.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const target = el.getAttribute("data-nav");
      if(target==="new"){
        setState({screen:"new", step:1, draft: emptyDraft(), showCustomNeedInput:false, showCustomEmotionInput:false, showEmotionGuide:false, showBodyFreeText:false, editingEntryId:null});
      } else if(target==="home" && state.editingEntryId){
        const editId = state.editingEntryId;
        setState({screen:"entryDetail", currentEntryId: editId, editingEntryId:null});
      } else {
        setState({screen: target, editingEntryId:null});
      }
    });
  });

  root.querySelectorAll("[data-open-entry]").forEach(el=>{
    el.addEventListener("click", ()=>{
      setState({screen:"entryDetail", currentEntryId: el.getAttribute("data-open-entry")});
    });
  });

  root.querySelectorAll("[data-edit-entry]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.getAttribute("data-edit-entry");
      const entry = state.entries.find(x=>x.id===id);
      if(!entry) return;
      setState({
        screen:"new", step:1, draft: loadDraftFromEntry(entry),
        editingEntryId: id,
        showCustomNeedInput:false, showCustomEmotionInput:false, showEmotionGuide:false,
        showBodyFreeText: !!entry.bodyFreeText,
      });
    });
  });

  root.querySelectorAll("[data-delete-entry]").forEach(el=>{
    el.addEventListener("click", ()=>{
      setState({confirmDeleteId: el.getAttribute("data-delete-entry")});
    });
  });

  const yesBtn = document.getElementById("confirm-delete-yes");
  if(yesBtn) yesBtn.addEventListener("click", ()=>{
    const id = state.confirmDeleteId;
    const remaining = state.entries.filter(e=>e.id!==id);
    saveEntries(remaining);
    setState({entries: remaining, confirmDeleteId:null, screen:"diary", currentEntryId:null});
  });
  const noBtn = document.getElementById("confirm-delete-no");
  if(noBtn) noBtn.addEventListener("click", ()=> setState({confirmDeleteId:null}));

  // back button in wizard
  const backBtn = root.querySelector("[data-back]");
  if(backBtn) backBtn.addEventListener("click", ()=>{
    if(state.step>1){ setState({step: state.step-1}); }
    else if(state.editingEntryId){
      const editId = state.editingEntryId;
      setState({screen:"entryDetail", currentEntryId: editId, editingEntryId:null});
    }
    else { setState({screen:"home"}); }
  });

  // ---- wizard field bindings ----
  const situationInput = document.getElementById("situation-input");
  if(situationInput) situationInput.addEventListener("input", e=>{
    state.draft.situation = e.target.value;
    refreshContinueBtn();
  });
  const thoughtInput = document.getElementById("thought-input");
  if(thoughtInput) thoughtInput.addEventListener("input", e=>{
    state.draft.thought = e.target.value;
    refreshContinueBtn();
  });
  const toggleBodyFreeTextBtn = document.getElementById("toggle-body-freetext-btn");
  if(toggleBodyFreeTextBtn) toggleBodyFreeTextBtn.addEventListener("click", ()=>{
    setState({showBodyFreeText:true});
    setTimeout(()=>{ const inp = document.getElementById("body-freetext-input"); if(inp) inp.focus(); }, 0);
  });
  const bodyFreeTextInput = document.getElementById("body-freetext-input");
  if(bodyFreeTextInput) bodyFreeTextInput.addEventListener("input", e=>{
    state.draft.bodyFreeText = e.target.value;
    refreshContinueBtn();
  });
  const actionCustomInput = document.getElementById("action-custom-input");
  if(actionCustomInput) actionCustomInput.addEventListener("input", e=>{
    state.draft.actionCustom = e.target.value;
    refreshContinueBtn();
  });

  root.querySelectorAll("[data-emotion-base]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const base = el.getAttribute("data-emotion-base");
      const has = state.draft.emotions.some(e=>e.base===base);
      if(has){
        state.draft.emotions = state.draft.emotions.filter(e=>e.base!==base);
      } else {
        state.draft.emotions.push({base, sub:null});
      }
      render();
    });
  });
  root.querySelectorAll("[data-emotion-sub]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const [base, sub] = el.getAttribute("data-emotion-sub").split("|");
      const idx = state.draft.emotions.findIndex(e=>e.base===base && e.sub===sub);
      if(idx>=0){
        state.draft.emotions.splice(idx,1);
        if(!state.draft.emotions.some(e=>e.base===base)){
          state.draft.emotions.push({base, sub:null});
        }
      } else {
        state.draft.emotions = state.draft.emotions.filter(e=>!(e.base===base && e.sub===null));
        state.draft.emotions.push({base, sub});
      }
      render();
    });
  });

  root.querySelectorAll("[data-body-area]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const area = el.getAttribute("data-body-area");
      if(state.draft.bodyAreas[area]){
        delete state.draft.bodyAreas[area];
      } else {
        state.draft.bodyAreas[area] = {sensations:[], custom:""};
      }
      render();
    });
  });
  root.querySelectorAll("[data-body-sensation]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const [area, sens] = el.getAttribute("data-body-sensation").split("|");
      const list = state.draft.bodyAreas[area].sensations;
      const i = list.indexOf(sens);
      if(i>=0) list.splice(i,1); else list.push(sens);
      render();
    });
  });

  root.querySelectorAll("[data-need]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const n = el.getAttribute("data-need");
      const i = state.draft.needs.indexOf(n);
      if(i>=0) state.draft.needs.splice(i,1); else state.draft.needs.push(n);
      render();
    });
  });

  const openGuideBtn = document.getElementById("open-emotion-guide-btn");
  if(openGuideBtn) openGuideBtn.addEventListener("click", ()=> setState({showEmotionGuide:true}));
  const closeGuideBtn = document.getElementById("close-emotion-guide-btn");
  if(closeGuideBtn) closeGuideBtn.addEventListener("click", ()=> setState({showEmotionGuide:false}));
  const guideOverlay = document.getElementById("emotion-guide-overlay");
  if(guideOverlay) guideOverlay.addEventListener("click", (e)=>{ if(e.target===guideOverlay) setState({showEmotionGuide:false}); });

  const addCustomNeedBtn = document.getElementById("add-custom-need-btn");
  if(addCustomNeedBtn) addCustomNeedBtn.addEventListener("click", ()=>{
    setState({showCustomNeedInput: true});
    setTimeout(()=>{ const inp = document.getElementById("custom-need-text"); if(inp) inp.focus(); }, 0);
  });
  const cancelCustomNeedBtn = document.getElementById("cancel-custom-need-btn");
  if(cancelCustomNeedBtn) cancelCustomNeedBtn.addEventListener("click", ()=> setState({showCustomNeedInput:false}));
  const saveCustomNeedBtn = document.getElementById("save-custom-need-btn");
  if(saveCustomNeedBtn) saveCustomNeedBtn.addEventListener("click", ()=>{
    const inp = document.getElementById("custom-need-text");
    const val = (inp && inp.value || "").trim();
    if(!val) return;
    const exists = NEEDS.concat(state.customNeeds).some(n => n.toLowerCase() === val.toLowerCase());
    if(!exists){
      state.customNeeds.push(val);
      saveCustomNeeds(state.customNeeds);
    }
    if(!state.draft.needs.includes(val)) state.draft.needs.push(val);
    setState({showCustomNeedInput:false});
  });

  const addCustomEmotionBtn = document.getElementById("add-custom-emotion-btn");
  if(addCustomEmotionBtn) addCustomEmotionBtn.addEventListener("click", ()=>{
    setState({showCustomEmotionInput: true});
    setTimeout(()=>{ const inp = document.getElementById("custom-emotion-text"); if(inp) inp.focus(); }, 0);
  });
  const cancelCustomEmotionBtn = document.getElementById("cancel-custom-emotion-btn");
  if(cancelCustomEmotionBtn) cancelCustomEmotionBtn.addEventListener("click", ()=> setState({showCustomEmotionInput:false}));
  const saveCustomEmotionBtn = document.getElementById("save-custom-emotion-btn");
  if(saveCustomEmotionBtn) saveCustomEmotionBtn.addEventListener("click", ()=>{
    const inp = document.getElementById("custom-emotion-text");
    const val = (inp && inp.value || "").trim();
    if(!val) return;
    const exists = Object.keys(EMOTIONS).concat(state.customEmotions).some(n => n.toLowerCase() === val.toLowerCase());
    if(!exists){
      state.customEmotions.push(val);
      saveCustomEmotions(state.customEmotions);
    }
    if(!state.draft.emotions.some(e=>e.base===val)) state.draft.emotions.push({base: val, sub: null});
    setState({showCustomEmotionInput:false});
  });

  root.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const a = el.getAttribute("data-action");
      const idx = state.draft.actions.indexOf(a);
      if(idx>=0){
        state.draft.actions.splice(idx,1);
      } else {
        if(state.draft.actions.length>=4) return;
        state.draft.actions.push(a);
      }
      render();
    });
  });

  const contBtn = document.getElementById("wizard-continue");
  if(contBtn) contBtn.addEventListener("click", handleWizardContinue);
}

function refreshContinueBtn(){
  const btn = document.getElementById("wizard-continue");
  if(!btn) return;
  if(wizardCanContinue()) btn.removeAttribute("disabled");
  else btn.setAttribute("disabled","true");
}

function handleWizardContinue(){
  if(!wizardCanContinue()) return;
  if(state.step < 6){
    setState({step: state.step+1});
  } else {
    // save entry
    const d = state.draft;
    const editId = state.editingEntryId;

    if(editId){
      const idx = state.entries.findIndex(x=>x.id===editId);
      if(idx>=0){
        const existing = state.entries[idx];
        const updated = Object.assign({}, existing, {
          situation: d.situation.trim(),
          thought: d.thought.trim(),
          emotions: d.emotions.map(e=>({base:e.base, sub:e.sub})),
          bodyAreas: d.bodyAreas,
          bodyFreeText: d.bodyFreeText.trim(),
          needs: d.needs.slice(),
          actions: d.actions.slice(),
          actionCustom: d.actionCustom.trim(),
          updatedAt: Date.now(),
        });
        delete updated.action; // superseded by actions array
        const newList = state.entries.slice();
        newList[idx] = updated;
        saveEntries(newList);
        setState({entries:newList, screen:"entryDetail", currentEntryId: editId, editingEntryId:null, draft: emptyDraft()});
        return;
      }
    }

    const entry = {
      id: "e" + Date.now() + Math.random().toString(36).slice(2,7),
      createdAt: Date.now(),
      situation: d.situation.trim(),
      thought: d.thought.trim(),
      emotions: d.emotions.map(e=>({base:e.base, sub:e.sub})),
      bodyAreas: d.bodyAreas,
      bodyFreeText: d.bodyFreeText.trim(),
      needs: d.needs.slice(),
      actions: d.actions.slice(),
      actionCustom: d.actionCustom.trim(),
    };
    const newList = [entry, ...state.entries];
    saveEntries(newList);
    setState({entries:newList, screen:"result", currentEntryId:entry.id, draft: emptyDraft()});
  }
}

/* ============ INIT ============ */
render();
</script>

if("serviceWorker" in navigator){

    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
